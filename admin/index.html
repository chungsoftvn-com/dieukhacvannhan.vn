  // ---- Dashboard page logic ----
  function openSite() {
    var f = new URLSearchParams(location.search).get('file');
    var target = f === 'products' ? '../vi/products/' : f === 'blog' ? '../vi/blog/' : '../';
    window.open(target, '_blank');
  }

  function generateSlug() {
    var title = document.getElementById('post-title').value;
    document.getElementById('post-slug').value = title
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[đĐ]/g, 'd')
      .replace(/([^0-9a-z-\s])/g, '')
      .replace(/(\s+)/g, '-');
  }

  async function handlePublish(e) {
    e.preventDefault();
    var title = document.getElementById('post-title').value;
    var slug = document.getElementById('post-slug').value;
    var content = document.getElementById('post-content').value;
    var token = localStorage.getItem('supabase_token');
    var statusMsg = document.getElementById('status-msg');
    var publishBtn = document.getElementById('publish-btn');

    publishBtn.disabled = true;
    publishBtn.textContent = UI.dashboard.publishing;
    statusMsg.textContent = '';

    if (DEV_MODE) {
      // TEST: không gửi lên production — tải bài viết về để commit thủ công
      var blob = new Blob([JSON.stringify({ type: 'blog-post', slug, title, content }, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'post-' + slug + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      statusMsg.className = 'text-sm font-medium text-amber-600';
      statusMsg.textContent = UI.toast.test_mode + ' — đã tải bài viết để commit thủ công.';
      publishBtn.disabled = false;
      publishBtn.textContent = UI.dashboard.status_publish;
      return;
    }

    try {
      var res = await fetch(WORKER_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || '') },
        body: JSON.stringify({ type: 'blog-post', title, slug, content })
      });
      var result = await res.json();
      if (res.ok && result.success) {
        statusMsg.className = 'text-sm font-medium text-green-600';
        statusMsg.textContent = UI.dashboard.published;
        document.getElementById('editor-form').reset();
      } else {
        throw new Error(result.error || UI.dashboard.system_error);
      }
    } catch (err) {
      statusMsg.className = 'text-sm font-medium text-red-600';
      statusMsg.textContent = UI.dashboard.failed + err.message;
    } finally {
      publishBtn.disabled = false;
      publishBtn.textContent = UI.dashboard.status_publish;
    }
  }

  window.onAdminReady = function () { /* dashboard: không cần tải gì thêm */ };

    async function initAuth() {
      if (DEV_MODE) { showEditor(); return; }
      var token = localStorage.getItem('supabase_token');
      if (location.hash && new URLSearchParams(location.hash.substring(1)).get('access_token')) {
        if (supabaseClient) {
          var d = await supabaseClient.auth.getSession();
          if (d.data.session) {
            localStorage.setItem('supabase_token', d.data.session.access_token);
            history.replaceState(null, '', location.pathname + location.search);
            showEditor();
            return;
          }
        }
      }
      if (token) { showEditor(); } else { showLogin(); }
    }

    async function handleLogin(e) {
      e.preventDefault();
      var err = document.getElementById('login-error');
      err.classList.add('hidden');
      if (!supabaseClient) { err.textContent = UI.login.error || 'Lỗi SDK'; err.classList.remove('hidden'); return; }
      var r = await supabaseClient.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
      if (r.error) { err.textContent = UI.login.error; err.classList.remove('hidden'); return; }
      var s = await supabaseClient.auth.getSession();
      if (s.data.session) { localStorage.setItem('supabase_token', s.data.session.access_token); showEditor(); }
    }

    async function handleGoogleLogin() {
      if (!supabaseClient) return;
      await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + location.pathname + '?file=' + ADMIN_FILE } });

    async function handleLogout() {
      if (supabaseClient) await supabaseClient.auth.signOut();
      localStorage.removeItem('supabase_token');
      showLogin();

    // toast helper used by pages
    var toastTimer = null;
    function toast(msg, type) {

      el.classList.remove('hidden');
      body.textContent = msg;
      body.className = 'rounded-xl px-5 py-4 text-sm font-medium shadow-lg ' + (type === 'error' ? 'bg-red-600 text-white' : 'bg-gray-900 text-white');
